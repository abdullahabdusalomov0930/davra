# Imports cards from a CSV file in this repository into the production project (README "Importing
# resources"). Started by hand only, from the Actions tab: choose the file, the moderator or admin whose
# name the cards are shared under, and whether to only check the file (the default).
#
# Uses the repository secrets of the migrations workflow: SUPABASE_PROJECT_ID, and SUPABASE_ACCESS_TOKEN to
# read the project's secret API key at run time (it is masked in the log). A SUPABASE_SECRET_KEY repository
# secret, if present, is used instead.
name: Import resources

on:
  workflow_dispatch:
    inputs:
      file:
        description: CSV file in the repository
        required: true
        default: data/launch-resources.csv
      author:
        description: Username of the moderator or admin who shares the cards (without @)
        required: true
      dry_run:
        description: Only check the file, write nothing
        type: boolean
        default: true

# Never run two imports at once.
concurrency:
  group: import-resources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SECRET_KEY_OVERRIDE: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Inputs reach the shell through the environment, never pasted into the script.
      IMPORT_FILE: ${{ inputs.file }}
      IMPORT_AUTHOR: ${{ inputs.author }}
      IMPORT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Connect to the production project
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Repository secret SUPABASE_PROJECT_ID is missing."
            exit 1
          fi
          key="$SECRET_KEY_OVERRIDE"
          if [ -z "$key" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
              echo "::error::Add the SUPABASE_ACCESS_TOKEN (or SUPABASE_SECRET_KEY) repository secret."
              exit 1
            fi
            # Management API: the project's API keys. A new-style secret key if there is one, else the
            # legacy service_role key.
            key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" |
              jq -r '(map(select(.type == "secret"))[0].api_key) // (map(select(.name == "service_role"))[0].api_key) // empty')
          fi
          if [ -z "$key" ]; then
            echo "::error::Could not read a secret API key; add it as the SUPABASE_SECRET_KEY repository secret."
            exit 1
          fi
          echo "::add-mask::$key"
          {
            echo "SUPABASE_SECRET_KEY=$key"
            echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co"
          } >> "$GITHUB_ENV"

      - name: Import
        run: |
          if [ "$IMPORT_DRY_RUN" = "true" ]; then
            pnpm import:resources "$IMPORT_FILE" --author "$IMPORT_AUTHOR" --dry-run
          else
            pnpm import:resources "$IMPORT_FILE" --author "$IMPORT_AUTHOR"
          fi
