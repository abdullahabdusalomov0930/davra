# Checks every pull request and every push to main: lint, types, formatting, unit tests, a dependency
# audit, a production build and a secret scan. Needs no repository secrets: the build uses placeholders.
# Actions are pinned to commit SHAs (supply chain); Dependabot keeps the pins and comments up to date.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Production and dev dependencies; fails on high and critical advisories. Ignored, by ID only:
      #   GHSA-vfj7-8cjw-p6xm  braces <= 3.0.3 (no fixed release yet), pulled in by build tools only
      #                        (shadcn CLI, eslint-config-next via fast-glob/micromatch) that never see
      #                        untrusted glob patterns. Drop the --ignore once a fixed braces is released.
      # (pnpm records --ignore in pnpm-workspace.yaml; on the runner that copy is thrown away.)
      - run: pnpm audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders that only satisfy scripts/check-env.ts; they are not credentials. The build never
      # contacts Supabase (data pages render per request), and "ci-placeholder" cannot be a real project
      # ref (refs are 20 lower-case letters).
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the commits of a pull request through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so every commit of the push or pull request is scanned.
          fetch-depth: 0
          persist-credentials: false

      # v3 is v2 on the Node 24 runtime (GitHub removed Node 20 from its runners in September 2026).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]] with targetRules, which needs gitleaks 8.25 or newer.
          GITLEAKS_VERSION: 8.30.1
          # PR comments would need pull-requests: write; findings (redacted) go to the job summary.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Not needed for a personal account. If the repository moves to an organization, add a free
          # license from gitleaks.io as the GITLEAKS_LICENSE secret and pass it here.
